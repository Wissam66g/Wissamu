name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/randtimer

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RandTimer"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.randtimer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.randtimer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="منبه عشوائي"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".LockScreenActivity"
                      android:exported="false"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTask"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true" />

                  <service
                      android:name=".TimerService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="user-started periodic reminder" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/randtimer/Util.kt
          package com.example.randtimer

          import android.content.Context
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager

          const val ALERT_TEXT = "انتبه ياوسام\nروح كتوب"

          @Suppress("DEPRECATION")
          fun Context.shake() {
              val v: Vibrator = if (Build.VERSION.SDK_INT >= 31)
                  getSystemService(VibratorManager::class.java).defaultVibrator
              else getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
              v.vibrate(VibrationEffect.createOneShot(300, 255))
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/randtimer/MainActivity.kt
          package com.example.randtimer

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val pad = (24 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(pad, pad, pad, pad)
                  }

                  fun lp() = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { topMargin = pad / 2 }

                  val test = Switch(this).apply {
                      text = "وضع التجربة (دورة 5 ثواني)"
                      textSize = 18f
                  }

                  val vib = Button(this).apply {
                      text = "جرّب الرجّة"
                      textSize = 22f
                  }

                  val start = Button(this).apply {
                      text = "ابدأ"
                      textSize = 24f
                  }

                  val stop = Button(this).apply {
                      text = "إيقاف"
                      textSize = 24f
                  }

                  val status = TextView(this).apply {
                      textSize = 16f
                      gravity = Gravity.CENTER
                  }

                  root.addView(test, lp())
                  root.addView(vib, lp())
                  root.addView(start, lp())
                  root.addView(stop, lp())
                  root.addView(status, lp())

                  setContentView(root)

                  vib.setOnClickListener { shake() }

                  start.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          status.text = "فعّل العرض فوق التطبيقات ثم ارجع واضغط ابدأ"
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                          )
                          return@setOnClickListener
                      }

                      if (Build.VERSION.SDK_INT >= 33 &&
                          checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          status.text = "اسمح بالإشعارات ثم اضغط ابدأ"
                          requestPermissions(
                              arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1
                          )
                          return@setOnClickListener
                      }

                      val prefs = getSharedPreferences("p", MODE_PRIVATE)
                      val pm = getSystemService(PowerManager::class.java)

                      if (!pm.isIgnoringBatteryOptimizations(packageName) &&
                          !prefs.getBoolean("asked", false)) {
                          prefs.edit().putBoolean("asked", true).apply()
                          status.text = "اضغط سماح لتجاهل توفير البطارية ثم اضغط ابدأ"
                          startActivity(
                              Intent(
                                  Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                  Uri.parse("package:$packageName")
                              )
                          )
                          return@setOnClickListener
                      }

                      val i = Intent(this, TimerService::class.java)
                          .putExtra("test", test.isChecked)

                      startForegroundService(i)
                      status.text = "شغّال ✓ (تقدر تقفل الشاشة)"
                  }

                  stop.setOnClickListener {
                      stopService(Intent(this, TimerService::class.java))
                      status.text = "متوقف"
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/randtimer/TimerService.kt
          package com.example.randtimer

          import android.app.KeyguardManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import kotlin.random.Random

          class TimerService : Service() {
              private val h = Handler(Looper.getMainLooper())
              private var cycleMs = 600_000L
              private var maxF = 540
              private var overlay: View? = null
              private var wl: PowerManager.WakeLock? = null
              private var running = false

              private val fireR = Runnable { alarm() }

              private val cycleR = object : Runnable {
                  override fun run() {
                      if (!running) return
                      h.postDelayed(
                          fireR,
                          Random.nextInt(1, maxF + 1) * 1000L
                      )
                      h.postDelayed(this, cycleMs)
                  }
              }

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val test = i?.getBooleanExtra("test", false) ?: false

                  cycleMs = if (test) 5_000L else 600_000L
                  maxF = if (test) 4 else 540

                  val nm = getSystemService(NotificationManager::class.java)

                  nm.createNotificationChannel(
                      NotificationChannel(
                          "t",
                          "Timer",
                          NotificationManager.IMPORTANCE_LOW
                      )
                  )

                  val n = Notification.Builder(this, "t")
                      .setContentTitle("المنبه شغال")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= 34)
                      startForeground(
                          1,
                          n,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      )
                  else startForeground(1, n)

                  if (wl == null) {
                      wl = getSystemService(PowerManager::class.java)
                          .newWakeLock(
                              PowerManager.PARTIAL_WAKE_LOCK,
                              "randtimer:wl"
                          )
                      wl?.acquire()
                  }

                  h.removeCallbacksAndMessages(null)
                  running = true
                  h.post(cycleR)

                  return START_STICKY
              }

              private fun alarm() {
                  shake()

                  val km = getSystemService(KeyguardManager::class.java)
                  val pm = getSystemService(PowerManager::class.java)

                  val locked = km.isKeyguardLocked || !pm.isInteractive

                  if (!locked && Settings.canDrawOverlays(this)) {
                      showOverlay()
                  } else {
                      try {
                          startActivity(
                              Intent(this, LockScreenActivity::class.java)
                                  .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          )
                      } catch (e: Exception) {
                          if (Settings.canDrawOverlays(this)) showOverlay()
                      }
                  }
              }

              private fun showOverlay() {
                  hide()

                  try {
                      val tv = TextView(this).apply {
                          text = ALERT_TEXT
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 40f)
                          gravity = Gravity.CENTER
                          setTextColor(Color.WHITE)
                          setBackgroundColor(Color.parseColor("#C62828"))
                          setOnClickListener { hide() }
                      }

                      val p = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.OPAQUE
                      )

                      getSystemService(WindowManager::class.java)
                          .addView(tv, p)

                      overlay = tv
                      h.postDelayed({ hide() }, 30_000L)

                  } catch (e: Exception) {
                  }
              }

              private fun hide() {
                  overlay?.let {
                      try {
                          getSystemService(WindowManager::class.java).removeView(it)
                      } catch (e: Exception) {
                      }
                  }
                  overlay = null
              }

              override fun onDestroy() {
                  running = false
                  h.removeCallbacksAndMessages(null)
                  hide()
                  wl?.release()
                  wl = null
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/randtimer/LockScreenActivity.kt
          package com.example.randtimer

          import android.app.Activity
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView

          class LockScreenActivity : Activity() {
              private val h = Handler(Looper.getMainLooper())

              @Suppress("DEPRECATION")
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)

                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true)
                      setTurnScreenOn(true)
                  }

                  window.addFlags(
                      WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                          WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON or
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  )

                  val tv = TextView(this).apply {
                      text = ALERT_TEXT
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 40f)
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#C62828"))
                      setOnClickListener { finish() }
                  }

                  setContentView(tv)
                  h.postDelayed({ finish() }, 30_000L)
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
          }
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RandTimer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
